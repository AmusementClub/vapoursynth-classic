name: Linux

on: [push, pull_request, workflow_dispatch]

jobs:
  build-gcc:
    runs-on: ubuntu-24.04

    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}

    strategy:
      matrix:
        include:
          - cc: gcc-13
            cxx: g++-13
          - cc: gcc-14
            cxx: g++-14
      fail-fast: false

    steps:
    - uses: actions/checkout@v4

    - name: Print compiler version
      run: ${{ env.CC }} --version

    - name: Install zimg
      run: |
        git clone https://github.com/sekrit-twc/zimg --branch v3.0 --depth 1
        pushd zimg
        ./autogen.sh
        ./configure --prefix=/usr
        make -j$(nproc)
        sudo make install -j$(nproc)
        popd
        rm -rf zimg

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        # Version range or exact version of a Python version to use, using SemVer's version range syntax.
        python-version: 3.12

    - name: Install cython
      run: |
        python -m pip install --upgrade pip
        pip install cython==3.0.12 setuptools==78.1.0 wheel==0.45.1

    - name: Set PKG_CONFIG_PATH
      run: echo "PKG_CONFIG_PATH=$pythonLocation/lib/pkgconfig" >> $GITHUB_ENV

    - name: configure
      run: |
        ./autogen.sh
        ./configure --prefix=/usr

    - name: make
      run: make -j$(nproc)

    - name: make install
      run: |
        sudo make install -j$(nproc)
        python setup.py install

    - name: Run test
      run: python -m unittest discover -s test -p "*test.py"
